paths:
  /api/reports/summary:
    get:
      summary: Obtener resumen financiero
      description: Obtiene un resumen de movimientos financieros agrupados por período con totales y saldo actual. Solo accesible para administradores.
      operationId: getReportSummary
      tags:
        - Reports
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Fecha de inicio del rango (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00.000Z'
        - name: endDate
          in: query
          description: Fecha de fin del rango (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-12-31T23:59:59.999Z'
        - name: type
          in: query
          description: Filtrar por tipo de movimiento
          required: false
          schema:
            type: string
            enum: [INCOME, EXPENSE]
        - name: groupBy
          in: query
          description: Agrupar movimientos por período
          required: false
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        '200':
          description: Resumen generado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReportSummary'
        '400':
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos (requiere rol ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reports/csv:
    get:
      summary: Exportar movimientos a CSV
      description: Genera y descarga un archivo CSV con los movimientos financieros filtrados. Solo accesible para administradores.
      operationId: exportMovementsToCsv
      tags:
        - Reports
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Fecha de inicio del rango (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00.000Z'
        - name: endDate
          in: query
          description: Fecha de fin del rango (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-12-31T23:59:59.999Z'
        - name: type
          in: query
          description: Filtrar por tipo de movimiento
          required: false
          schema:
            type: string
            enum: [INCOME, EXPENSE]
        - name: sortBy
          in: query
          description: Campo por el cual ordenar
          required: false
          schema:
            type: string
            enum: [date, amount, concept, type]
            default: date
        - name: sortOrder
          in: query
          description: Orden ascendente o descendente
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Archivo CSV generado exitosamente
          content:
            text/csv:
              schema:
                type: string
                format: binary
                example: |
                  ID,Fecha,Concepto,Tipo,Monto,Usuario,Email,Fecha de Creación
                  cm1abc123,2025-01-15,Salario mensual,Ingreso,5000.00,Juan Pérez,juan@example.com,2025-01-15 10:30:00
                  cm1def456,2025-01-20,Renta,Egreso,1500.00,Juan Pérez,juan@example.com,2025-01-20 15:45:00
          headers:
            Content-Disposition:
              description: Nombre del archivo CSV
              schema:
                type: string
                example: attachment; filename="movimientos_2025-10-06.csv"
        '400':
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos (requiere rol ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ReportSummary:
      type: object
      properties:
        totalIncome:
          type: number
          description: Total de ingresos en el período
          example: 15000.50
        totalExpense:
          type: number
          description: Total de egresos en el período
          example: 8500.25
        currentBalance:
          type: number
          description: Saldo actual (ingresos - egresos)
          example: 6500.25
        movementsByPeriod:
          type: array
          description: Movimientos agrupados por período
          items:
            $ref: '#/components/schemas/GroupedMovement'
        totalMovements:
          type: integer
          description: Número total de movimientos
          example: 42
        dateRange:
          type: object
          description: Rango de fechas aplicado
          properties:
            start:
              type: string
              format: date-time
              nullable: true
              example: '2025-01-01T00:00:00.000Z'
            end:
              type: string
              format: date-time
              nullable: true
              example: '2025-12-31T23:59:59.999Z'

    GroupedMovement:
      type: object
      properties:
        period:
          type: string
          description: Período de agrupación (formato depende del groupBy)
          example: '2025-01'
        income:
          type: number
          description: Total de ingresos en el período
          example: 5000.00
        expense:
          type: number
          description: Total de egresos en el período
          example: 3000.00
        balance:
          type: number
          description: Balance del período (ingresos - egresos)
          example: 2000.00
        count:
          type: integer
          description: Cantidad de movimientos en el período
          example: 8

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              description: Mensaje de error
              example: 'Parámetros de consulta inválidos'
            code:
              type: string
              description: Código de error
              example: 'VALIDATION_ERROR'
            details:
              type: array
              description: Detalles adicionales del error (opcional)
              items:
                type: object
